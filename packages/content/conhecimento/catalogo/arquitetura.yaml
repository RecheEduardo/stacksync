  - id: D-02
    ambito: estrutura
    texto: Dentro de {existente}, as divisões entre áreas do código são claras?
    porQue: Fronteiras internas claras dão os benefícios da separação sem o custo da rede. É o primeiro passo antes de distribuir (RN-21).
    tipo: opcao
    opcoes:
      - { id: sem, rotulo: "Não há divisões: qualquer parte usa qualquer outra" }
      - { id: fracas, rotulo: "Existem, mas são desrespeitadas com frequência" }
      - { id: claras, rotulo: Claras e respeitadas na maior parte do tempo }
      - { id: automaticas, rotulo: Garantidas por verificações automáticas }
    padrao: [fracas, claras, automaticas]
    modo: E
    subniveis: *existente
    peso: 4
    obrigatoria: true
    alimenta: [E1.C]
    pontes:
      - id: D-02.p1
        texto: Para mudar uma regra típica, quantas áreas do código precisam ser tocadas?
        opcoes:
          - { id: uma, rotulo: Uma área, converte: [claras, automaticas], explicacao: Mudanças que ficam numa área indicam fronteiras respeitadas. }
          - { id: poucas, rotulo: Duas ou três, converte: [fracas, claras], explicacao: Mudanças que vazam para algumas áreas indicam fronteiras parciais. }
          - { id: muitas, rotulo: Muitas, converte: [sem, fracas], explicacao: Mudanças espalhadas indicam fronteiras ausentes ou fracas. }
      - id: D-02.p2
        texto: Dá para testar uma área isoladamente, sem subir o resto?
        opcoes:
          - { id: sim, rotulo: Sim, converte: [claras, automaticas], explicacao: Teste isolado só é possível com fronteiras claras. }
          - { id: nao, rotulo: Não, converte: [sem, fracas], explicacao: "Sem teste isolado, as áreas dependem umas das outras por dentro." }
    comoDescobrir: Veja quantos arquivos e pastas as últimas mudanças típicas tocaram.
    quemPodeSaber: Líder técnico
    segundos: 20
    permiteMedida: false

  - id: D-03
    ambito: estrutura
    texto: Para acrescentar um campo novo numa tela, quantos lugares do código precisam mudar?
