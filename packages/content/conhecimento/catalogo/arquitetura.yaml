  - id: D-01
    ambito: estrutura
    texto: Quantas partes de {existente} são publicadas separadamente?
    porQue: O número de partes publicadas separadamente é a medida de distribuição. Cada parte a mais cobra comunicação e operação.
    termos:
      - { termo: publicar, explicacao: "Colocar uma versão em produção (implantar). Uma parte com processo de publicação próprio conta como uma." }
    tipo: opcao
    opcoes:
      - { id: "1", rotulo: Uma só }
      - { id: 2_5, rotulo: 2 a 5 }
      - { id: 6_20, rotulo: 6 a 20 }
      - { id: 21_100, rotulo: 21 a 100 }
      - { id: mais_100, rotulo: Mais de 100 }
