    texto: Se um dado aparecer atualizado só alguns segundos depois em outra tela, alguma operação importante sairia prejudicada?
    porQue: Operações que exigem dados sempre atualizados pedem que as partes fiquem juntas ou com consistência imediata; as que toleram atraso aceitam filas e eventos.
