    condicao:
      alguma:
        - *multiplosTimes
        - *variasPartes
    peso: 4
    alimenta: [E6.C]
    pontes:
      - id: E-03.p1
        texto: Quando uma parte quebra, quem é chamado?
        opcoes:
          - { id: sempre_mesmo, rotulo: Sempre o mesmo time, converte: [todas, maioria], explicacao: Um time acionado por padrão é o dono. }
          - { id: quem_puder, rotulo: Quem estiver disponível, converte: [poucas, nenhuma], explicacao: "Sem um time acionado por padrão, a propriedade não está definida." }
    comoDescobrir: Veja quem atendeu os últimos incidentes de cada parte.
    quemPodeSaber: Líderes dos times
    segundos: 15
    permiteMedida: false

  - id: E-05
    ambito: times
    texto: Com que frequência uma entrega exige trabalho combinado entre times?
    porQue: Coordenação constante entre times é o sinal mais claro de fronteiras desalinhadas com a organização.
    tipo: opcao
    opcoes:
      - { id: raramente, rotulo: Raramente }
      - { id: as_vezes, rotulo: Às vezes }
      - { id: quase_sempre, rotulo: Quase sempre }
    padrao: [raramente, as_vezes, quase_sempre]
    modo: E
    subniveis: *existente
    condicao: *multiplosTimes
    peso: 5
    cobre: [F2]
    alimenta: [E6.C, E2.N]
    pontes:
      - id: E-05.p1
        texto: Das últimas 10 funcionalidades entregues, quantas envolveram mais de um time?
        opcoes:
          - { id: poucas, rotulo: Até 2, converte: [raramente], explicacao: Poucas entregas conjuntas indicam coordenação rara. }
          - { id: metade, rotulo: 3 a 6, converte: [as_vezes], explicacao: Metade das entregas conjuntas indica coordenação frequente. }
          - { id: quase_todas, rotulo: 7 ou mais, converte: [quase_sempre], explicacao: Quase todas as entregas conjuntas indicam coordenação constante. }
    comoDescobrir: Olhe as últimas 10 funcionalidades entregues e conte quantas precisaram de mais de um time.
    quemPodeSaber: Líderes dos times
    segundos: 15
    permiteMedida: true

  - id: E-06
    ambito: saude
    texto: Quantas pessoas conhecem bem as partes mais críticas de {existente}?
    porQue: Conhecimento concentrado em uma pessoa é risco, e a mudança precisa envolver quem conhece o legado (Xia et al., 2018).
    tipo: opcao
    opcoes:
      - { id: uma, rotulo: Uma pessoa ou ninguém }
      - { id: duas, rotulo: Duas }
      - { id: tres_mais, rotulo: Três ou mais }
    padrao: [uma, duas, tres_mais]
    modo: C
    subniveis: *existente
    peso: 2
    alimenta: [H5]
    segundos: 15
    permiteMedida: false

  - id: E-09
    ambito: operacao
    texto: Quem atende quando algo quebra fora do horário?
    porQue: Plantão estruturado é parte da capacidade operacional que a arquitetura exige.
    tipo: opcao
    opcoes:
      - { id: ninguem, rotulo: Ninguém de forma combinada }
      - { id: informal, rotulo: Quem estiver disponível }
      - { id: escala, rotulo: Uma escala de plantão }
      - { id: time_dedicado, rotulo: Um time dedicado à confiabilidade }
    padrao: [informal, escala, time_dedicado]
    modo: C
    subniveis: *arqOrg
    peso: 3
    alimenta: [E7.C, T6.N]
    segundos: 15
    permiteMedida: false

  - id: F-01
    ambito: saude
    texto: Com que frequência há publicação em produção?
    porQue: Frequência de publicação é uma das quatro métricas de entrega (DORA) e a linha de base para comparar depois.
    tipo: opcao
    opcoes:
      - { id: varias_dia, rotulo: Várias vezes por dia }
      - { id: diaria, rotulo: Uma vez por dia }
      - { id: semanal, rotulo: Semanal }
      - { id: mensal, rotulo: Mensal }
      - { id: rara, rotulo: Mais rara que mensal }
    padrao: [diaria, semanal, mensal]
    modo: C
    subniveis: *existente
    peso: 2
    alimenta: [H6]
    segundos: 15
    permiteMedida: true

  - id: F-02
    ambito: saude
    texto: Uma correção pequena aprovada hoje chega à produção em quanto tempo?
    porQue: O tempo até a produção mostra o custo de coordenação que a arquitetura cobra hoje.
    tipo: opcao
    opcoes:
      - { id: horas, rotulo: Em horas }
      - { id: dias, rotulo: Em alguns dias }
      - { id: semanas, rotulo: Em 1 a 4 semanas }
      - { id: mes, rotulo: Mais de um mês }
    padrao: [horas, dias, semanas]
    modo: C
    subniveis: *existente
    peso: 3
    alimenta: [H6]
    pontes:
      - id: F-02.p1
        texto: Uma correção de uma linha aprovada hoje chega à produção quando?
        opcoes:
          - { id: hoje, rotulo: Hoje, converte: [horas], explicacao: Correções que saem no mesmo dia indicam tempo em horas. }
          - { id: semana, rotulo: Em até uma semana, converte: [dias, semanas], explicacao: "Correções pequenas costumam ser o caminho mais rápido; mudanças típicas tendem a levar mais." }
          - { id: depois, rotulo: Depois disso, converte: [semanas, mes], explicacao: Correções que esperam semanas indicam um trem de publicações. }
    comoDescobrir: Veja quando a última correção pequena foi aprovada e quando chegou à produção.
    quemPodeSaber: Líder técnico
    segundos: 15
    permiteMedida: true

  - id: F-03
    ambito: saude
    texto: Das últimas 10 publicações, quantas precisaram de correção fora do planejado ou de reversão?
    porQue: A taxa de falha de mudança é uma das métricas de entrega (DORA).
    tipo: opcao
    opcoes:
      - { id: 0_1, rotulo: Nenhuma ou uma }
      - { id: 2_3, rotulo: 2 ou 3 }
      - { id: 4_mais, rotulo: 4 ou mais }
    padrao: [0_1, 2_3, 4_mais]
    modo: C
    subniveis: *existente
    peso: 2
    alimenta: [H6]
    segundos: 15
    permiteMedida: true

  - id: F-04
    ambito: disponibilidade
    texto: Na última queda, quanto tempo levou para voltar ao normal?
    porQue: O tempo de restauração mostra a resiliência real, além da redundância declarada.
    tipo: opcao
    opcoes:
      - { id: menos_1h, rotulo: Menos de 1 hora }
      - { id: horas, rotulo: Algumas horas }
      - { id: dia, rotulo: Cerca de um dia }
      - { id: mais, rotulo: Mais que isso }
    padrao: [menos_1h, horas, dia]
    modo: C
    subniveis: *existente
    peso: 2
    alimenta: [E5.C, H6]
    segundos: 15
    permiteMedida: true

  - id: F-05
    ambito: saude
    texto: As mudanças e os defeitos se concentram em algumas áreas?
    porQue: Dívida técnica cobra juros onde o código muda e quebra com frequência; é ali que mexer compensa primeiro (Tornhill e Borg, 2022).
    tipo: opcao
    opcoes:
      - { id: concentrados, rotulo: "Sim, em poucas áreas" }
      - { id: espalhados, rotulo: Estão espalhados }
      - { id: sem_padrao, rotulo: Não há defeitos que voltam }
    padrao: [concentrados, espalhados, sem_padrao]
    modo: C
    subniveis: *existente
    peso: 3
    alimenta: [H1, E1.C]
    segundos: 15
    permiteMedida: false

  - id: F-06
    ambito: saude
    texto: Numa semana típica, quanto do tempo do time vai para contornar problemas do código?
    porQue: Tempo perdido com contornos é o custo de não agir (média relatada de 23%, Besker et al., 2019).
    tipo: opcao
    opcoes:
      - { id: menos_10, rotulo: Menos de 10% }
      - { id: 10_25, rotulo: Entre 10% e 25% }
      - { id: mais_25, rotulo: Mais de 25% }
    padrao: [menos_10, 10_25, mais_25]
    modo: C
    subniveis: *existente
    peso: 3
    alimenta: [H1]
    segundos: 15
    permiteMedida: true

  - id: F-08
    ambito: saude
    texto: Que testes protegem o comportamento atual de {existente}?
    porQue: Sem testes que fixem o comportamento atual, não há como provar que uma mudança preserva o que funciona (Feathers, 2004).
    tipo: opcao
    opcoes:
      - { id: nenhum, rotulo: Quase nenhum }
      - { id: poucos, rotulo: Poucos }
      - { id: criticas, rotulo: Boa cobertura nas áreas críticas }
      - { id: contratos, rotulo: Inclui testes de contrato entre partes }
    padrao: [poucos, criticas, contratos]
    modo: C
    subniveis: *ref
    peso: 3
    alimenta: [H2]
    segundos: 15
    permiteMedida: false

  - id: F-10
    ambito: operacao
    texto: Quais destas tarefas já são automáticas em {existente}?
    textoPorSubnivel:
      planejamento.sistema: Quais destas tarefas a organização já faz de forma automática em outros sistemas?
      planejamento.ferramenta: Quais destas tarefas a organização já faz de forma automática?
    porQue: Publicação, monitoramento e provisionamento automáticos são pré-requisito antes de distribuir (Fowler, 2014).
    tipo: multipla
    opcoes:
      - { id: publicacao, rotulo: Publicação em produção }
      - { id: alertas, rotulo: Monitoramento com alertas }
      - { id: provisionamento, rotulo: Criação de ambientes e servidores }
      - { id: rastreamento, rotulo: Rastreamento de requisições entre partes }
      - { id: nenhuma, rotulo: Nenhuma }
    padrao: [publicacao, alertas, nenhuma]
    modo: E
    subniveis: *arqOrg
    peso: 4
    obrigatoria: true
    alimenta: [E7.C, T6.N]
    pontes:
      - id: F-10.p1
        texto: Como vocês descobrem que algo caiu?
        opcoes:
          - { id: alerta, rotulo: Por um alerta, faixaSinal: { sinal: automacao, faixa: [0.5, 2.25] }, explicacao: Descobrir por alerta indica monitoramento automático. }
          - { id: cliente, rotulo: Pelo cliente, faixaSinal: { sinal: automacao, faixa: [0, 1.0] }, explicacao: Falhas descobertas pelo cliente indicam falta de monitoramento com alertas. }
      - id: F-10.p2
        texto: Criar um ambiente novo leva horas ou semanas?
        opcoes:
          - { id: horas, rotulo: Horas, faixaSinal: { sinal: automacao, faixa: [1.0, 2.25] }, explicacao: Ambientes em horas indicam provisionamento automático. }
          - { id: semanas, rotulo: Semanas, faixaSinal: { sinal: automacao, faixa: [0, 1.5] }, explicacao: Ambientes em semanas indicam provisionamento manual. }
    comoDescobrir: Veja como foi a última publicação e como o último incidente foi descoberto.
    quemPodeSaber: Operações
    segundos: 20
    permiteMedida: false

  - id: F-11
    ambito: saude
    texto: Quando as dependências principais foram atualizadas pela última vez?
    porQue: Dependências desatualizadas são a regra, não a exceção (81,5% dos projetos, Kula et al., 2018), e acumulam vulnerabilidades.
    tipo: opcao
    opcoes:
      - { id: menos_6m, rotulo: Nos últimos 6 meses }
      - { id: 6_12m, rotulo: Entre 6 e 12 meses }
      - { id: mais_1a, rotulo: Há mais de 1 ano }
      - { id: vulneravel, rotulo: Há vulnerabilidade conhecida sem correção }
    padrao: [menos_6m, 6_12m, mais_1a]
    modo: C
    subniveis: *ref
    peso: 2
    alimenta: [H3]
    segundos: 15
    permiteMedida: false

  - id: F-12
    ambito: obrigacoes
    texto: O runtime, o framework principal ou o banco de {existente} perdem suporte em breve?
    porQue: A data de fim de suporte costuma ser o gatilho real e inadiável; ela fixa o prazo máximo (RN-02).
    tipo: opcao
    opcoes:
      - { id: ja_perdeu, rotulo: Já perderam suporte }
      - { id: menos_6m, rotulo: Em menos de 6 meses }
      - { id: 6_18m, rotulo: Entre 6 e 18 meses }
      - { id: mais_18m, rotulo: Só daqui a mais de 18 meses }
    padrao: [menos_6m, 6_18m, mais_18m]
    modo: C
    subniveis: *refarq
    peso: 3
    alimenta: [H4, Obrigações]
    comoDescobrir: "O endoflife.date lista as datas de fim de suporte por versão."
    quemPodeSaber: Líder técnico
    segundos: 15
    permiteMedida: true

  - id: G-T
    ambito: transicao
    texto: Se a mudança exigir manter o antigo e o novo funcionando juntos por alguns meses, isso é viável?
    porQue: Toda mudança incremental tem um período com antigo e novo em paralelo, e esse custo costuma ser subestimado (Taibi et al., 2017).
    tipo: opcao
    opcoes:
      - { id: viavel, rotulo: Viável }
      - { id: dificil, rotulo: "Difícil, mas possível" }
      - { id: inviavel, rotulo: Inviável }
    padrao: [viavel, dificil, inviavel]
    modo: E
    subniveis: [refatoracao.sistema, refatoracao.modulo, refatoracao.ferramenta, planejamento.modulo]
    condicao: { profundidade: [equilibrado, avancado] }
    peso: 4
    cobre: [F4]
    alimenta: [Custo de mudar, P5]
    segundos: 15
    permiteMedida: false

  - id: G-T2
    ambito: transicao
    texto: Há prazo fixo ou limite de pessoas para a primeira entrega?
    porQue: Prazo e pessoas limitados favorecem a forma mais simples que atende; complexidade extra cobra esforço desde o primeiro dia.
    tipo: opcao
    opcoes:
      - { id: rigido, rotulo: "Sim, prazo e pessoas apertados" }
      - { id: folga, rotulo: Há alguma folga }
      - { id: sem_restricao, rotulo: Sem restrição relevante }
    padrao: [rigido, folga, sem_restricao]
    modo: E
    subniveis: [planejamento.sistema, planejamento.ferramenta]
    condicao: { profundidade: [equilibrado, avancado] }
    peso: 4
    cobre: [F4]
    alimenta: [Custo de mudar, P5]
    segundos: 15
    permiteMedida: false

  - id: G-R
    ambito: reversibilidade
    texto: Mudanças grandes em {existente} podem ser feitas aos poucos, com volta atrás em cada etapa?
    porQue: Um caminho em etapas, com ponto de volta em cada uma, é condição para aprovar mudanças estruturais (RN-49).
    tipo: opcao
    opcoes:
      - { id: sim, rotulo: "Sim, em etapas pequenas" }
      - { id: parcial, rotulo: "Em parte: algumas etapas não têm volta" }
      - { id: nao, rotulo: Só dá para fazer de uma vez }
    padrao: [sim, parcial, nao]
    modo: E
    subniveis: [refatoracao.sistema, refatoracao.modulo, refatoracao.ferramenta, planejamento.modulo]
    condicao: { profundidade: [equilibrado, avancado] }
    peso: 4
    cobre: [F5]
    alimenta: [Reversibilidade, P5]
    segundos: 15
    permiteMedida: false

  - id: G-R2
    ambito: reversibilidade
    texto: "Alguma decisão deste planejamento será difícil de desfazer depois? Por exemplo, o modelo de dados, um contrato com terceiros ou o fornecedor de nuvem."
    porQue: Decisões difíceis de desfazer merecem análise antes; as fáceis devem ser tomadas rápido e ficar atrás de uma interface (RN-49).
    tipo: opcao
    opcoes:
      - { id: nenhuma, rotulo: Nenhuma relevante }
      - { id: algumas, rotulo: Algumas }
      - { id: varias, rotulo: Várias }
    padrao: [nenhuma, algumas, varias]
