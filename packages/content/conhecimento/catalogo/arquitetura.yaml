  - id: D-06
    ambito: dados
    texto: Que mecanismos mantêm os dados coerentes entre as partes?
    porQue: Compensações, eventos e registros de mensagens são complexidade nova; só se pagam quando os fluxos pedem.
    termos:
      - { termo: compensação, explicacao: "Desfazer passos já feitos quando um passo seguinte falha (saga)." }
      - { termo: outbox, explicacao: "Gravar a mensagem a enviar junto com os dados, para não perder nem duplicar." }
    tipo: multipla
    opcoes:
      - { id: transacoes, rotulo: Transações dentro de cada parte }
      - { id: compensacoes, rotulo: Compensações para desfazer passos }
      - { id: eventos, rotulo: Eventos com atualização posterior }
      - { id: outbox, rotulo: Registro de mensagens junto com os dados }
      - { id: nenhum, rotulo: Nenhum mecanismo especial }
    padrao: [transacoes, eventos, nenhum]
    modo: C
    subniveis: *existente
    condicao: *variasPartes
    peso: 2
    alimenta: [E3.C]
    segundos: 20
    permiteMedida: false

