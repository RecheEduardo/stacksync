          - { id: poucos, rotulo: 2 a 5, converte: [2_5], explicacao: Cada processo de publicação costuma corresponder a uma parte. }
          - { id: varios, rotulo: 6 a 20, converte: [6_20], explicacao: Cada processo de publicação costuma corresponder a uma parte. }
          - { id: muitos, rotulo: Mais de 20, converte: [21_100, mais_100], explicacao: Cada processo de publicação costuma corresponder a uma parte. }
      - id: D-01.p2
        texto: Quantos repositórios de código têm publicação própria?
        opcoes:
          - { id: um, rotulo: Um, converte: ["1", 2_5], explicacao: "Um repositório pode publicar mais de uma parte, mas raramente muitas." }
          - { id: poucos, rotulo: 2 a 5, converte: [2_5], explicacao: Repositórios com publicação própria são partes separadas. }
          - { id: muitos, rotulo: Mais de 5, converte: [6_20, 21_100], explicacao: Repositórios com publicação própria são partes separadas. }
