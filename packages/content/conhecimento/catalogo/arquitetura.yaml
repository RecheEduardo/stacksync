# Catálogo de perguntas (P3 8.4), reescrito em linguagem simples (RN-96).
# Perguntam características do sistema, nunca regras de negócio, nomes de clientes ou código.
# {alvo} e {existente} são trocados pelo texto do subnível (estrutura.yaml).

grupos:
  todos: &todos [refatoracao.sistema, refatoracao.modulo, refatoracao.ferramenta, planejamento.sistema, planejamento.modulo, planejamento.ferramenta]
  arq: &arq [refatoracao.sistema, refatoracao.modulo, planejamento.sistema, planejamento.modulo]
  existente: &existente [refatoracao.sistema, refatoracao.modulo, planejamento.modulo]
  refarq: &refarq [refatoracao.sistema, refatoracao.modulo]
  ref: &ref [refatoracao.sistema, refatoracao.modulo, refatoracao.ferramenta]
  arqOrg: &arqOrg [refatoracao.sistema, refatoracao.modulo, planejamento.sistema, planejamento.modulo, refatoracao.ferramenta, planejamento.ferramenta]

multiplosTimes: &multiplosTimes { pergunta: E-01, em: [times_2_3, times_4_8, times_mais_8] }
variasPartes: &variasPartes { pergunta: D-01, naoEm: ["1"] }

perguntas:
  - id: M-01
    ambito: meta
    texto: O que mais precisa melhorar em {alvo}?
    textoPorSubnivel:
      planejamento.sistema: O que {alvo} precisa garantir acima de tudo?
      planejamento.modulo: O que {alvo} precisa garantir acima de tudo?
      planejamento.ferramenta: O que a ferramenta precisa garantir acima de tudo?
    porQue: A meta define quais eixos pesam nos motivos e é a base para julgar se uma mudança melhora o que importa.
    tipo: multipla
    maxSelecoes: 2
    opcoes:
      - { id: entregar_rapido, rotulo: Entregar mudanças mais rápido }
      - { id: aguentar_uso, rotulo: Aguentar mais uso }
      - { id: responder_rapido, rotulo: Responder mais rápido }
      - { id: cair_menos, rotulo: Ficar menos tempo fora do ar }
      - { id: custar_menos, rotulo: Custar menos para operar }
      - { id: manter_facil, rotulo: Ficar mais fácil de manter }
      - { id: cumprir_prazo, rotulo: "Cumprir um prazo externo (fim de suporte, regulação)" }
      - { id: nada_especifico, rotulo: "Nada específico: quero saber se está adequado" }
    padrao: [entregar_rapido, manter_facil, aguentar_uso, nada_especifico]
    modo: E
    subniveis: *todos
    peso: 5
    obrigatoria: true
    cobre: [F1]
    alimenta: [Meta, P2]
    segundos: 30
    permiteMedida: false

  - id: M-02
    ambito: meta
    texto: Isso tem um número hoje e uma meta?
    porQue: Uma meta com valor atual e alvo é o que permite dizer se uma mudança vale a pena. Sem ela, nenhuma mudança passa no portão da meta mensurável.
    termos:
      - { termo: meta mensurável, explicacao: "Um número que se pode acompanhar, como tempo de resposta, horas fora do ar por mês ou dias até uma correção chegar à produção." }
    tipo: opcao
    opcoes:
      - { id: valor_e_meta, rotulo: "Sim: sabemos o valor de hoje e a meta" }
      - { id: so_valor, rotulo: "Sabemos o valor de hoje, mas não há meta" }
      - { id: so_meta, rotulo: "Há uma meta, mas não medimos hoje" }
      - { id: nenhum, rotulo: Nem um nem outro }
    padrao: [valor_e_meta, so_valor, nenhum]
    modo: E
    subniveis: *todos
    condicao:
      todas:
        - { pergunta: M-01, naoEm: [nada_especifico] }
        - alguma:
            - { ideiaPrevia: true }
            - { profundidade: [equilibrado, avancado] }
    peso: 4
    cobre: [F1]
    alimenta: [Meta, P2]
    comoDescobrir: Procure o painel de monitoramento ou o último relatório de entregas; o número de hoje costuma estar lá.
    quemPodeSaber: Líder técnico ou operações
    segundos: 25
    permiteMedida: true

  - id: M-03
    ambito: motivo
    texto: O que motivou a ideia que você já tem?
    porQue: O motivo é o primeiro portão da ideia. Tendência de mercado sozinha não basta para mudar (RN-01).
    tipo: opcao
    opcoes:
      - { id: fim_suporte, rotulo: Algo que usamos vai perder suporte }
      - { id: licenca, rotulo: Mudança de licença de um componente }
      - { id: regulacao, rotulo: Exigência de regulação }
      - { id: incidentes, rotulo: Incidentes ou quedas }
      - { id: custo, rotulo: Custo alto }
      - { id: entregas_lentas, rotulo: Entregas lentas }
      - { id: requisito_novo, rotulo: Um requisito novo }
      - { id: manutencao, rotulo: Dificuldade de manter }
      - { id: escala, rotulo: Falta de escala }
      - { id: tendencia, rotulo: É o que o mercado está usando }
    padrao: [manutencao, entregas_lentas, escala, tendencia]
    modo: E
    subniveis: *todos
    condicao: { ideiaPrevia: true }
    peso: 4
    obrigatoria: true
    alimenta: [P1]
    segundos: 20
    permiteMedida: false

  - id: M-04
    ambito: motivo
    texto: Dá para mostrar esse motivo com um dado, um incidente registrado ou uma data oficial?
    porQue: Um motivo legítimo sem evidência deixa o portão do gatilho indeterminado.
    tipo: opcao
    opcoes:
      - { id: sim, rotulo: Sim }
      - { id: parcial, rotulo: Em parte }
      - { id: nao, rotulo: Não }
    padrao: [sim, parcial, nao]
    modo: C
    subniveis: *todos
    condicao:
      todas:
        - { ideiaPrevia: true }
        - { pergunta: M-03, naoEm: [tendencia] }
    peso: 3
    alimenta: [P1]
    segundos: 15
    permiteMedida: false

  - id: B-01
    ambito: horizonte
    texto: Por quanto tempo {alvo} deve continuar em uso?
    porQue: Se a vida útil restante for curta, corrigir um desajuste pode não se pagar. Nesse caso, conviver com ele é a decisão racional (RN-84).
    tipo: opcao
    opcoes:
      - { id: menos_1, rotulo: Menos de 1 ano }
      - { id: 1_3, rotulo: 1 a 3 anos }
      - { id: 3_5, rotulo: 3 a 5 anos }
      - { id: mais_5, rotulo: Mais de 5 anos }
      - { id: sem_prazo, rotulo: Sem prazo para acabar }
    padrao: [1_3, 3_5, sem_prazo]
    modo: E
    subniveis: *todos
    peso: 3
    alimenta: [Conviver, T3]
    pontes:
      - id: B-01.p1
        texto: É um experimento ou um produto mínimo com data para ser validado?
        opcoes:
          - { id: sim, rotulo: Sim, converte: [menos_1, 1_3], explicacao: Experimentos com data de validação têm horizonte curto até prova em contrário. }
          - { id: nao, rotulo: Não, converte: [3_5, mais_5, sem_prazo], explicacao: Sistemas que não são experimento costumam durar anos. }
      - id: B-01.p2
        texto: Existe plano de substituir {alvo}?
        opcoes:
          - { id: em_breve, rotulo: "Sim, nos próximos meses", converte: [menos_1], explicacao: Um plano de substituição próximo encurta o horizonte. }
          - { id: sem_data, rotulo: "Sim, mas sem data", converte: [1_3, 3_5], explicacao: Planos sem data costumam se arrastar por alguns anos. }
          - { id: nao, rotulo: Não, converte: [3_5, mais_5, sem_prazo], explicacao: "Sem plano de substituição, o horizonte é longo." }
    comoDescobrir: Pergunte se há plano de substituição ou data de validação do produto.
    quemPodeSaber: Liderança de produto
    segundos: 15
    permiteMedida: false

  - id: B-02
    ambito: disponibilidade
    texto: Se {alvo} ficar 1 hora fora do ar, o que acontece?
    porQue: O impacto de ficar fora do ar define quanta redundância e quanta operação a arquitetura precisa ter.
    tipo: opcao
    opcoes:
      - { id: nada, rotulo: Nada relevante }
      - { id: incomodo, rotulo: Incômodo para quem usa }
      - { id: receita, rotulo: Perda de receita }
      - { id: contrato, rotulo: Quebra de contrato ou de regra }
      - { id: pessoas, rotulo: Risco para pessoas }
    padrao: [incomodo, receita, contrato]
    modo: E
    subniveis: *arq
    peso: 4
    alimenta: [E5.N, E7.N]
    pontes:
      - id: B-02.p1
        texto: Alguém é acionado de madrugada quando {alvo} cai?
        opcoes:
          - { id: sim, rotulo: Sim, converte: [receita, contrato, pessoas], explicacao: Plantão de madrugada só existe quando a queda custa caro. }
          - { id: nao, rotulo: Não, converte: [nada, incomodo, receita], explicacao: "Sem plantão, a queda costuma ser tolerável por algumas horas." }
      - id: B-02.p2
        texto: Já houve multa, reclamação formal ou cobrança por indisponibilidade?
        opcoes:
          - { id: sim, rotulo: Sim, converte: [contrato, pessoas], explicacao: Multa ou reclamação formal indica contrato ou regra envolvidos. }
          - { id: nao, rotulo: Não, converte: [nada, incomodo, receita], explicacao: "Sem cobrança formal, o impacto fica abaixo de quebra de contrato." }
    comoDescobrir: Veja se há acordo de nível de serviço em contrato e o que aconteceu na última queda.
    quemPodeSaber: Operações ou liderança de produto
    segundos: 20
    permiteMedida: false

  - id: B-03
    ambito: mudanca
    texto: Com que frequência as regras de {alvo} mudam?
    porQue: Ritmo de mudança alto pede fronteiras internas mais fortes; ritmo baixo dispensa estrutura extra.
    tipo: opcao
    opcoes:
      - { id: raramente, rotulo: Raramente }
      - { id: ano, rotulo: Algumas vezes por ano }
      - { id: mes, rotulo: Todo mês }
      - { id: semana, rotulo: Toda semana }
    padrao: [ano, mes, semana]
    modo: E
    subniveis: *arq
    peso: 4
    alimenta: [E1.N, E8.N]
    pontes:
      - id: B-03.p1
        texto: Quantas demandas de mudança chegaram no último trimestre?
        opcoes:
          - { id: poucas, rotulo: Até 5, converte: [raramente, ano], explicacao: Poucas demandas por trimestre indicam mudanças esporádicas. }
          - { id: varias, rotulo: 6 a 30, converte: [mes], explicacao: Algumas demandas por mês indicam ritmo mensal. }
          - { id: muitas, rotulo: Mais de 30, converte: [semana], explicacao: Várias demandas por semana indicam ritmo semanal. }
    comoDescobrir: Conte as demandas do último trimestre no quadro de tarefas.
    quemPodeSaber: Líder técnico ou produto
    segundos: 15
    permiteMedida: true

  - id: B-03b
    ambito: mudanca
    texto: As mudanças se concentram em algumas áreas ou se espalham por tudo?
    porQue: Áreas que mudam em ritmos diferentes são um motivo legítimo para separar fronteiras (Ford et al., 2021).
    tipo: opcao
    opcoes:
      - { id: poucas_areas, rotulo: Concentram-se em poucas áreas }
      - { id: espalhadas, rotulo: Espalham-se por várias áreas }
      - { id: tudo_junto, rotulo: Tudo muda no mesmo ritmo }
    padrao: [poucas_areas, espalhadas, tudo_junto]
    modo: C
    subniveis: *arq
    condicao: { pergunta: B-03, naoEm: [raramente] }
    peso: 3
    alimenta: [E2.N, E1.N]
    segundos: 15
    permiteMedida: false

  - id: B-04
    ambito: mudanca
    texto: Quão previsível é o futuro do produto?
    porQue: Incerteza alta dá valor a pontos de extensão; previsibilidade alta torna a generalidade um custo sem retorno.
    tipo: opcao
    opcoes:
      - { id: estavel, rotulo: Estável e conhecido }
      - { id: previsivel, rotulo: Evolui de forma previsível }
      - { id: pivos, rotulo: Pode mudar de direção }
      - { id: incerto, rotulo: Muito incerto }
    padrao: [estavel, previsivel, pivos]
    modo: C
    subniveis: *arq
    peso: 2
    alimenta: [E8.N]
    segundos: 15
    permiteMedida: false

  - id: B-05
    ambito: mudanca
    texto: Quantas variações {alvo} atende? Por exemplo, clientes com regras próprias, marcas, países ou parceiros.
    porQue: O número de variações define quanta flexibilidade a arquitetura precisa ter.
    tipo: opcao
    opcoes:
      - { id: uma, rotulo: Uma só }
      - { id: poucas, rotulo: Poucas (2 a 5) }
      - { id: varias, rotulo: Várias (6 a 20) }
      - { id: muitas, rotulo: Muitas (mais de 20) }
      - { id: plataforma, rotulo: É uma plataforma que terceiros estendem }
    padrao: [uma, poucas, varias]
    modo: C
    subniveis: *arq
    peso: 2
    alimenta: [E8.N]
    segundos: 15
    permiteMedida: true

  - id: B-08
    ambito: obrigacoes
    texto: Alguma destas situações se aplica?
    porQue: Regulação cria obrigações com data, que aparecem à parte do ajuste e fixam prazos.
    tipo: multipla
    opcoes:
      - { id: ue, rotulo: Vende software ou serviço para a União Europeia }
      - { id: transferencia, rotulo: Dados pessoais vão para fora do Brasil }
      - { id: regulado, rotulo: "Setor regulado (financeiro, saúde, governo)" }
      - { id: nenhuma, rotulo: Nenhuma }
    padrao: [nenhuma, transferencia, regulado]
    modo: C
    subniveis: *todos
    peso: 2
    alimenta: [Obrigações, E5.N]
    segundos: 15
    permiteMedida: false

  - id: B-09
    ambito: estrutura
    texto: O que {alvo} faz bem hoje e precisa ser preservado?
    porQue: Legado não é sinônimo de ruim (Khadka et al., 2014). O que funciona entra no custo de mudar.
    tipo: multipla
    maxSelecoes: 3
    opcoes:
      - { id: confiavel, rotulo: Funciona de forma confiável }
      - { id: regras_corretas, rotulo: As regras estão corretas }
      - { id: desempenho, rotulo: Tem bom desempenho }
      - { id: time_conhece, rotulo: O time conhece bem }
      - { id: nada, rotulo: Nada em especial }
    padrao: [confiavel, regras_corretas, time_conhece]
    modo: C
    subniveis: *ref
    peso: 2
    alimenta: [Custo de mudar]
    segundos: 20
    permiteMedida: false

  - id: B-10
    ambito: estrutura
    texto: Quantas áreas bem diferentes {alvo} atende? Por exemplo, cadastro, faturamento e estoque contam como três.
    porQue: Mais áreas distintas pedem fronteiras internas mais claras e, às vezes, partes separadas.
    tipo: opcao
    opcoes:
      - { id: 1_2, rotulo: Uma ou duas }
      - { id: 3_5, rotulo: 3 a 5 }
      - { id: 6_10, rotulo: 6 a 10 }
      - { id: mais_10, rotulo: Mais de 10 }
    padrao: [1_2, 3_5, 6_10]
    modo: E
    subniveis: *arq
    peso: 4
    alimenta: [E1.N, E2.N]
    segundos: 15
    permiteMedida: false

  - id: B-11
    ambito: carga
    texto: "{alvo} depende de serviços externos que às vezes ficam lentos ou fora do ar? Por exemplo, pagamentos, parceiros ou outros sistemas."
    porQue: Dependências instáveis são o caso clássico em que desacoplar no tempo, com filas, compensa.
    tipo: opcao
    opcoes:
      - { id: nao, rotulo: Não }
      - { id: poucos, rotulo: Um ou dois }
      - { id: varios, rotulo: Vários }
    padrao: [nao, poucos, varios]
    modo: C
    subniveis: *arq
    peso: 3
    alimenta: [E3.N]
    segundos: 15
    permiteMedida: false

  - id: C-02
    ambito: carga
    texto: Quanto {alvo} é usado num dia normal?
    porQue: O volume de uso define quanta capacidade de escala é necessária; escala além disso é custo sem retorno.
    tipo: opcao
    opcoes:
      - { id: baixo, rotulo: "Pouco: até algumas centenas de pessoas", detalhe: ou poucas operações por minuto }
      - { id: moderado, rotulo: "Moderado: alguns milhares de pessoas", detalhe: ou dezenas de operações por minuto }
      - { id: alto, rotulo: "Alto: dezenas de milhares", detalhe: ou centenas de operações por minuto }
      - { id: muito_alto, rotulo: "Muito alto: centenas de milhares ou mais", detalhe: ou milhares de operações por segundo }
    padrao: [baixo, moderado, alto]
    modo: E
    subniveis: *todos
    peso: 3
    alimenta: [E4.N, T1.N]
    pontes:
      - id: C-02.p1
        texto: Quantos pedidos, atendimentos ou transações acontecem por dia?
        opcoes:
          - { id: centenas, rotulo: Algumas centenas, converte: [baixo], explicacao: Centenas de transações por dia são carga baixa. }
          - { id: milhares, rotulo: Alguns milhares, converte: [moderado], explicacao: Milhares por dia são carga moderada. }
          - { id: dezenas_milhares, rotulo: Dezenas de milhares, converte: [alto], explicacao: Dezenas de milhares por dia são carga alta. }
          - { id: mais, rotulo: Mais que isso, converte: [muito_alto], explicacao: Centenas de milhares por dia são carga muito alta. }
    comoDescobrir: O painel de monitoramento ou o relatório de acessos mostra o volume diário.
    quemPodeSaber: Operações ou time de dados
    segundos: 15
    permiteMedida: true

  - id: C-02b
    ambito: carga
    texto: No dia mais movimentado do ano, quanto o uso sobe em relação a um dia normal?
    porQue: Picos fortes pedem folga de escala ou desacoplamento no tempo.
    tipo: opcao
    opcoes:
      - { id: ate_2x, rotulo: Até o dobro }
      - { id: 2_5x, rotulo: De 2 a 5 vezes }
      - { id: 5_10x, rotulo: De 5 a 10 vezes }
      - { id: mais_10x, rotulo: Mais de 10 vezes }
    padrao: [ate_2x, 2_5x, 5_10x]
    modo: C
    subniveis: *arq
    peso: 2
    alimenta: [E4.N, E3.N]
    segundos: 15
    permiteMedida: true

  - id: C-03
    ambito: carga
    texto: Quanto o uso deve crescer nos próximos 12 a 24 meses?
    porQue: Crescimento previsto justifica preparar a escala; crescimento imaginado não.
    tipo: opcao
    opcoes:
      - { id: estavel, rotulo: Deve ficar estável }
      - { id: ate_2x, rotulo: Até dobrar }
      - { id: 2_10x, rotulo: De 2 a 10 vezes }
      - { id: mais_10x, rotulo: Mais de 10 vezes }
    padrao: [estavel, ate_2x, 2_10x]
    modo: E
    subniveis: *todos
    peso: 3
    alimenta: [E4.N, T1.N]
    pontes:
      - id: C-03.p1
        texto: Há expansão comercial planejada, como novo canal, país ou um cliente grande?
        opcoes:
          - { id: sim, rotulo: Sim, converte: [ate_2x, 2_10x], explicacao: Expansões planejadas costumam dobrar o uso ou mais. }
          - { id: nao, rotulo: Não, converte: [estavel, ate_2x], explicacao: "Sem expansão planejada, o uso tende a ficar perto do atual." }
    comoDescobrir: O plano comercial do próximo ano costuma trazer a expectativa de crescimento.
    quemPodeSaber: Liderança de produto
    segundos: 15
    permiteMedida: false

  - id: C-04
    ambito: carga
    texto: Algumas partes de {alvo} têm picos ou volumes muito diferentes das outras? Por exemplo, um fechamento de mês ou um processamento noturno.
    porQue: Perfis de carga distintos são um motivo legítimo para escalar partes separadamente.
    tipo: opcao
    opcoes:
      - { id: nao, rotulo: Não }
      - { id: algumas, rotulo: Algumas }
      - { id: muitas, rotulo: "Sim, várias" }
    padrao: [nao, algumas, muitas]
    modo: C
    subniveis: *arq
    peso: 3
    alimenta: [E2.N, E4.N]
    segundos: 15
    permiteMedida: false

  - id: C-05
    ambito: carga
    texto: Como está o tempo de resposta da operação mais importante?
    porQue: Lentidão acima do aceitável é falta de capacidade, mesmo que a estrutura pareça adequada.
    tipo: opcao
    opcoes:
      - { id: folga, rotulo: Bem dentro do aceitável }
      - { id: limite, rotulo: Perto do limite nos picos }
      - { id: estoura_pico, rotulo: Passa do aceitável nos picos }
      - { id: estoura, rotulo: Passa do aceitável quase sempre }
    padrao: [folga, limite, estoura_pico]
    modo: E
    subniveis: [refatoracao.sistema, refatoracao.modulo, planejamento.modulo, refatoracao.ferramenta]
    peso: 3
    alimenta: [E4.C, T1.C]
    pontes:
      - id: C-05.p1
        texto: As pessoas reclamam de lentidão?
        opcoes:
          - { id: nunca, rotulo: Quase nunca, converte: [folga, limite], explicacao: "Sem reclamações, o tempo de resposta tende a estar dentro do aceitável." }
          - { id: pico, rotulo: Nos horários de pico, converte: [limite, estoura_pico], explicacao: Reclamações só no pico indicam limite atingido nos picos. }
          - { id: sempre, rotulo: Quase sempre, converte: [estoura], explicacao: Reclamações constantes indicam lentidão fora do pico. }
      - id: C-05.p2
        texto: Há tempos-limite estourando com frequência?
        opcoes:
          - { id: nao, rotulo: Não, converte: [folga, limite], explicacao: "Sem tempos-limite estourando, a operação responde a tempo." }
          - { id: semanal, rotulo: Toda semana, converte: [estoura_pico, estoura], explicacao: Tempos-limite semanais indicam latência acima do aceitável. }
    comoDescobrir: O monitoramento de tempo de resposta (p99) da operação principal responde isso.
    quemPodeSaber: Operações
    segundos: 20
    permiteMedida: true

  - id: C-06
    ambito: disponibilidade
    texto: Qual é a meta de disponibilidade do fluxo principal?
