    alimenta: [E1.C, E8.C]
    segundos: 15
    permiteMedida: false

  - id: D-04
    ambito: estrutura
    texto: Como as partes de {existente} conversam entre si?
    porQue: Cada chamada pela rede herda latência e falhas; mensagens desacoplam no tempo, mas cobram consistência eventual e reprocessamento.
    termos:
      - { termo: chamada que espera resposta, explicacao: "Uma parte chama outra e fica esperando (síncrono)." }
      - { termo: mensagem que não espera, explicacao: "Uma parte deixa um recado numa fila e segue (assíncrono)." }
    tipo: opcao
    opcoes:
      - { id: mesmo_processo, rotulo: Dentro do mesmo processo }
      - { id: sincrono, rotulo: "Pela rede, esperando a resposta" }
      - { id: assincrono, rotulo: "Por mensagens que não esperam resposta (filas, eventos)" }
      - { id: mistura, rotulo: Uma mistura das duas }
    padrao: [sincrono, assincrono, mistura]
    modo: E
    subniveis: *existente
    condicao: *variasPartes
    peso: 4
    alimenta: [E3.C]
    segundos: 20
    permiteMedida: false

  - id: D-05
    ambito: estrutura
    texto: No fluxo mais importante, quantas partes são chamadas em sequência antes da resposta?
    porQue: "Com mais partes em sequência, a chance de uma ficar lenta ou fora do ar cresce: 1 − (1 − p)^n (Dean e Barroso, 2013)."
    tipo: opcao
    opcoes:
      - { id: "1", rotulo: Uma }
      - { id: 2_3, rotulo: 2 ou 3 }
      - { id: 4_6, rotulo: 4 a 6 }
      - { id: 7_mais, rotulo: 7 ou mais }
    padrao: ["1", 2_3, 4_6]
