        texto: Quantas partes precisam estar no ar para o fluxo principal terminar?
        opcoes:
          - { id: uma, rotulo: Uma, converte: ["1"], explicacao: "Se só uma parte precisa estar no ar, não há cadeia." }
          - { id: poucas, rotulo: Duas ou três, converte: [2_3], explicacao: Cada parte necessária costuma ser um salto da cadeia. }
          - { id: muitas, rotulo: Quatro ou mais, converte: [4_6, 7_mais], explicacao: Cada parte necessária costuma ser um salto da cadeia. }
    comoDescobrir: O rastreamento de uma requisição do fluxo principal mostra a sequência de chamadas.
    quemPodeSaber: Líder técnico
    segundos: 20
    permiteMedida: true

