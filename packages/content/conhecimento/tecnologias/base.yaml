  - id: postgresql
    nome: PostgreSQL
    categorias: [banco_dados]
    resumo: Banco relacional aberto, com tipos ricos e documentos em JSON.
    licenca: { nome: PostgreSQL License (permissiva), aberta: true, fonte: "https://github.com/postgres/postgres/blob/master/COPYRIGHT", consultadoEm: "2026-11-10" }
    eol: { produto: postgresql }
    popularidade: { percentual: 55.6, levantamento: *so, fonte: *fonteSo, consultadoEm: "2026-11-10" }
    governanca: Grupo global de desenvolvimento, sem empresa dona.
    complexidade: Exige um servidor e cuidados de operação moderados.
    simplicidade: Um banco atende transações, consultas e documentos sem componentes extras.
    atende: [relacional, documentos, chave_valor, servidor]
    perfil: { capacidade: { banco_dados: [3, 3.5] }, ecossistema: [3.5, 4], seguranca: [3, 3.5], mercado: [3.5, 4], exigenciaOperacional: [2, 2.5] }

