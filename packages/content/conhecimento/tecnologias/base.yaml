# Base de referência de tecnologias (DT-31, RN-95). Cresce por curadoria em pull request.
# Fatos datados (licença, fim de suporte, popularidade) têm fonte e data de consulta.
# Os níveis de perfil (0 a 4) são avaliações comparativas dentro da categoria, revisáveis.
# Popularidade é sinal de ecossistema e de mercado de trabalho, nunca motivo sozinho (RN-01).

consulta: "2026-11-10"
levantamento: &so "Stack Overflow Developer Survey 2025, seção Technology, todos os respondentes"
fonteSo: &fonteSo https://survey.stackoverflow.co/2025/technology

categorias:
  banco_dados: { rotulo: Banco de dados, decisao: banco_dados, troca: { escopo: total, reversivel: false, movimentaDados: true } }
  mensageria: { rotulo: Mensageria e filas, decisao: mensageria, troca: { escopo: parcial, reversivel: true, movimentaDados: true } }
  cache: { rotulo: Cache em memória, decisao: cache, troca: { escopo: parcial, reversivel: true, movimentaDados: false } }
  linguagem: { rotulo: Linguagem e plataforma de execução, decisao: linguagem, troca: { escopo: total, reversivel: false, movimentaDados: false } }
  framework_web: { rotulo: Framework de servidor web, decisao: framework_web, troca: { escopo: total, reversivel: false, movimentaDados: false } }
  iac: { rotulo: Infraestrutura como código, decisao: iac, troca: { escopo: parcial, reversivel: true, movimentaDados: false } }

decisoes:
  banco_dados: { nome: Banco de dados principal, categoria: banco_dados, descricao: Onde os dados do sistema vivem. }
  mensageria: { nome: Fila de mensagens, categoria: mensageria, descricao: O componente que desacopla as interações no tempo. }
  cache: { nome: Cache, categoria: cache, descricao: Memória rápida na frente dos dados. }
  linguagem: { nome: Linguagem e plataforma de execução, categoria: linguagem, descricao: Em que o código é escrito e executado. }
  framework_web: { nome: Framework de servidor web, categoria: framework_web, descricao: A base do serviço web. }
  iac: { nome: Infraestrutura como código, categoria: iac, descricao: Como ambientes e servidores são descritos e criados. }

tecnologias:
