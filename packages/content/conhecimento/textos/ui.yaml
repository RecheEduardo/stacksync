ui.enquadramento.titulo: Nova análise
ui.enquadramento.aviso: Não mudar nada é um resultado válido e frequente. O StackSync só propõe mudanças quando o ganho compensa.
ui.enquadramento.p1: O que você quer avaliar?
ui.enquadramento.p2: Em que nível?
ui.enquadramento.p3: Você já tem uma ideia?
ui.enquadramento.p3.ajuda: "Opcional. Descreva o que pensa em fazer, sem nomes de clientes nem regras do negócio. O StackSync diz o quanto ela adere à necessidade real e compara com não mudar."
