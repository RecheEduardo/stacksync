ui.ia.titulo: Conectar a IA
ui.ia.porQue: A IA escolhe a próxima pergunta pelo perfil do sistema e sugere as respostas mais comuns. Ela não decide o resultado; o resultado sai de regras e pesos explícitos.
ui.ia.enviado: "Em cada etapa vai só o necessário: a pergunta, as respostas dadas e o enquadramento. Nunca vão o nome da organização nem a sua ideia prévia nas sugestões."
ui.ia.cobranca: O uso é cobrado pelo provedor, na sua própria conta.
