ui.painel.titulo: Análises
ui.painel.vazio: Nenhuma análise ainda. A análise rápida leva cerca de 7 minutos.
ui.painel.vazio.explica: O StackSync compara o que o sistema precisa com o que a arquitetura entrega e diz se a sua ideia faz sentido, qual seria o plano ideal ou se é melhor não mexer.
