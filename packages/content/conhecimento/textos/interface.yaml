# ---------------------------------------------------------------- como o StackSync decide (T-03)
ui.metodo.titulo: Como o StackSync decide
ui.metodo.resumo: "O StackSync compara o que o sistema precisa com o que a arquitetura entrega, eixo por eixo, e só propõe mudança quando o ganho passa de um limite fixo. Mesmas respostas, mesmo resultado."
ui.metodo.ajuste.titulo: Necessidade contra capacidade
ui.metodo.ajuste.texto: |-
  Cada eixo tem uma necessidade, o que as respostas dizem que o sistema precisa, e uma capacidade, o que a arquitetura entrega hoje. As duas são níveis de 0 a 4, sempre em faixa, porque estimativas e respostas desconhecidas alargam a incerteza.
  O desvio é a capacidade menos a necessidade. Sobra é capacidade além da necessidade; falta é capacidade aquém dela. Dentro da zona de tolerância hachurada, o eixo está ajustado.
ui.metodo.ajuste.legenda: "Exemplo ilustrativo: um eixo com {valor} de sobra, {faixa}, fora da tolerância."
ui.metodo.eixos.titulo: Os eixos
ui.metodo.eixos.texto: Na arquitetura, oito eixos. O peso diz quanto cada um conta no Índice de Ajuste; a tolerância diz quanto desvio ainda é ajuste.
ui.metodo.eixos.eixo: Eixo
ui.metodo.eixos.peso: Peso
ui.metodo.eixos.tolerancia: Tolerância
ui.metodo.eixos.toleranciaValor: "falta {falta}, sobra {sobra}"
ui.metodo.eixos.ferramenta: "Na escolha ou troca de ferramenta técnica, os eixos são outros: {eixos}."
ui.metodo.indice.titulo: Índice de Ajuste, faixa e confiança
ui.metodo.indice.texto: |-
  O Índice de Ajuste vai de 0 a 100 e mede o quanto uma proposta (a sua ideia, o plano ideal ou o sistema atual) se ajusta à necessidade real. Sobreajuste e subajuste são medidos em separado e os dois descontam do índice; um não compensa o outro.
  O índice sempre aparece em faixa, com a confiança ao lado. A categoria só muda quando o desvio passa de {limiar} pontos.
ui.metodo.indice.exemplo: Exemplo ilustrativo de régua do Índice de Ajuste, entre 58 e 76
ui.metodo.indice.legenda: "Exemplo ilustrativo. As marcas tracejadas são os limites das faixas de aderência: {limites}."
ui.metodo.faixa.85: De 85 a 100, a proposta atende à necessidade real.
ui.metodo.faixa.70: De 70 a 84, atende na maior parte; alguns pontos pedem ajuste.
ui.metodo.faixa.50: De 50 a 69, resolve parte do problema, mas deixa necessidades importantes de fora ou cria outras.
ui.metodo.faixa.30: De 30 a 49, se afasta da necessidade real em pontos centrais.
ui.metodo.faixa.0: De 0 a 29, não corresponde à necessidade descrita.
ui.metodo.onus.titulo: O ônus da prova é da mudança
ui.metodo.onus.texto: |-
  Toda proposta é comparada com não mudar. Uma mudança só é recomendada quando melhora o ajuste mesmo no limite desfavorável da faixa e o ganho passa de {materialidade} pontos. "Não mexa" e "a solução mais simples basta" são resultados tão legítimos quanto qualquer plano.
  A ideia que você já tem passa por cinco portões, em ordem.
ui.metodo.portao.P1: O motivo precisa ser um problema do sistema, com evidência; tendência de mercado não basta.
ui.metodo.portao.P2: É preciso saber o valor de hoje e a meta.
ui.metodo.portao.P3: O ajuste projetado precisa melhorar, não piorar.
ui.metodo.portao.P4: "O ganho precisa passar de {materialidade} pontos."
ui.metodo.portao.P5: Se uma alternativa menos invasiva alcança quase o mesmo ganho, ela vem antes.
ui.metodo.naoSei.titulo: Quando você não sabe
ui.metodo.naoSei.texto: |-
  "Não sei" é uma resposta válida. Ela alarga a faixa do resultado, e o StackSync oferece perguntas mais fáceis para estimar, com a conversão explicada. Toda estimativa fica marcada como inferida e nada vale sem a sua confirmação.
  No resultado, as perguntas que decidiriam aparecem com como descobrir e quem pode saber.
ui.metodo.ia.titulo: O papel da IA
ui.metodo.ia.texto: |-
  A IA que você conecta escolhe a próxima pergunta dentro de uma estrutura fixa, sugere as respostas mais comuns para o perfil, interpreta texto livre e explica o resultado como segunda opinião.
  Ela não decide o resultado: o Índice de Ajuste, a categoria, os portões e o plano saem de regras e pesos explícitos. As sugestões nunca veem a sua ideia prévia nem resultados parciais, e nada que a IA produz é gravado sem a sua confirmação.
ui.metodo.calibracao.titulo: Calibração vigente
ui.metodo.calibracao.texto: "Calibração {versao}, de {data}. Os pesos e limiares são verificados contra casos de referência com solução conhecida, e toda mudança é versionada."
ui.metodo.naoFaz.titulo: O que o StackSync não faz
ui.metodo.naoFaz.texto: |-
  Não decide por você: o resultado é apoio, com os motivos e a incerteza à vista.
  Não usa a IA para dar o veredito, e não recomenda tecnologia que ainda não passou pela avaliação da base de referência.
  Não pede o conteúdo do seu negócio: só características técnicas do sistema.
