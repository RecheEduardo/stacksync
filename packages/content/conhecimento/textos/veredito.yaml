ideia.veredito.justificada_em_principio: A mudança se justifica em princípio. Custo, retorno e prontidão ainda não foram avaliados.
ideia.veredito.existe_caminho_melhor: "O problema é real, mas {alternativa} alcança ao menos {pct}% do ganho com {criterio}."
ideia.veredito.ganho_irrisorio: "O ganho estimado ({ganho} pontos) fica abaixo do limiar de materialidade ({limiar}). {base, select, nao_mudar {Não mudar é a decisão recomendada.} other {{baseRotulo} é a decisão recomendada.}}"
ideia.veredito.contraproducente: "A mudança afasta o sistema do ajuste: Índice de Ajuste projetado entre {projLo} e {projHi}, contra entre {atualLo} e {atualHi} hoje."
ideia.veredito.sem_fundamento: O motivo informado não basta para mudar. Qual atributo de qualidade está sendo afetado?
ideia.veredito.inconclusiva: "Não dá para concluir no portão {portao}: {motivo}"
ideia.criterio.menos_invasiva: menos invasividade
ideia.criterio.mais_reversivel: mais reversibilidade

portao.P1: Gatilho legítimo
portao.P2: Meta mensurável
portao.P3: Direção do ajuste
portao.P4: Materialidade
portao.P5: Alternativa menos invasiva
portao.P1.passa: O motivo é legítimo e tem evidência.
portao.P1.passaEstimado: O motivo é legítimo; no nível Rápido, a evidência conta como estimativa.
portao.P1.naoPassa: Tendência ou o que outras empresas fazem não basta como motivo (RN-01).
portao.P1.indeterminado: O motivo é legítimo, mas ainda sem evidência.
portao.P1.semResposta: O motivo da ideia não foi informado.
portao.P2.passa: Há valor de hoje e meta.
portao.P2.naoPassa: Falta uma meta com valor de hoje e alvo.
portao.P2.indeterminado: A meta existe, mas falta o valor de hoje ou o alvo.
portao.P2.semMeta: "A meta é saber se está adequado; não há métrica a melhorar."
portao.P3.passa: O ajuste projetado melhora mesmo no limite desfavorável.
portao.P3.naoPassa: O ajuste projetado piora em toda a faixa.
portao.P3.indeterminado: As faixas do ajuste atual e do projetado se sobrepõem.
portao.P4.passa: "O ganho passa do limiar de materialidade ({limiar} pontos) mesmo no limite desfavorável."
portao.P4.naoPassa: "O ganho fica abaixo do limiar de materialidade ({limiar} pontos) em toda a faixa."
portao.P4.indeterminado: "A faixa do ganho atravessa o limiar de materialidade ({limiar} pontos)."
portao.P5.passa: Nenhuma alternativa menos invasiva alcança ganho equivalente.
portao.P5.naoPassa: "{alternativa} alcança ao menos {pct}% do ganho com menos invasividade."
portao.P5.indeterminado: Faltam dados para comparar a invasividade.
portao.estado.passa: Passa
portao.estado.nao_passa: Não passa
portao.estado.indeterminado: Indeterminado
portao.estado.nao_avaliado: Não avaliado

