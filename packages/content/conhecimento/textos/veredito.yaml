# Modelos de texto oficiais do veredito (Parte 4, 9.8; P3 10.4 e 12.6).
# Sintaxe: {variavel}, {n, plural, one {...} other {...}} e {x, select, a {...} other {...}}.
# Passam pelo lint de vocabulário (FF-06): sem superlativo, urgência, exclamação ou condicional vago.

