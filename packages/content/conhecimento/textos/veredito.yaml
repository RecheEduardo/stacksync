veredito.ajustado.frase: "{sujeito} atende às necessidades declaradas."
veredito.ajustado.fechamento.refatoracao: Nenhuma refatoração estrutural se justifica hoje.
veredito.ajustado.fechamento.ferramenta: Nenhuma troca de ferramenta se justifica hoje.
veredito.ajustado.fechamento.planejamento: Nada além da forma mais simples se justifica hoje.
veredito.ajustado.saudavel: Ajustado e saudável. Nenhuma ação necessária.
veredito.ajustado.comAlerta: "{n, plural, one {Com # alerta de saúde crítico, reportado como fato.} other {Com # alertas de saúde críticos, reportados como fato.}}"
veredito.sobreajustado.frase: "{sujeito} tem mais {mecanismos} do que as necessidades declaradas pedem, principalmente em {eixos}."
veredito.subajustado.frase: "{sujeito} limita as necessidades declaradas, principalmente em {eixos}."
veredito.misto.frase: Sobra estrutura em {eixosSobra} e falta em {eixosFalta}.
veredito.misto.predominante: "{lado, select, sobra {Predominantemente sobreajustado.} other {Predominantemente subajustado.}}"
veredito.misto.dependencia: A falta em {eixoFalta} diminui se a sobra em {eixoSobra} for reduzida.
veredito.indefinido.frase: "Com as respostas atuais, não dá para afirmar se {objeto} está {x} ou {y}. {n, plural, one {Uma resposta concentra a incerteza.} other {# respostas concentram a incerteza.}}"
veredito.inconclusivo.frase: Faltam respostas para um veredito. Comece pelas perguntas abaixo.
veredito.conviver.frase: "Há {lado} em {eixos}, mas a correção não se paga no horizonte de {horizonte}. Conviver é a decisão racional."
veredito.naoAvaliados: "{n, plural, one {Não avaliado nesta profundidade: {eixos}.} other {Não avaliados nesta profundidade: {eixos}.}}"

objeto.sistema: o sistema
objeto.ferramenta: a ferramenta
lado.sobra: sobreajuste
lado.falta: subajuste

aderencia.85: Sua proposta atende à necessidade real.
aderencia.70: Sua proposta atende à necessidade na maior parte; alguns pontos pedem ajuste.
aderencia.50: Sua proposta resolve parte do problema, mas deixa necessidades importantes de fora ou cria outras.
aderencia.30: Sua proposta se afasta da necessidade real em pontos centrais.
aderencia.0: Sua proposta não corresponde à necessidade descrita.
aderencia.curta.85: atende à necessidade real
aderencia.curta.70: atende na maior parte
aderencia.curta.50: resolve parte do problema
aderencia.curta.30: se afasta em pontos centrais
aderencia.curta.0: não corresponde à necessidade
aderencia.entre: "Entre “{a}” e “{b}”."
aderencia.decidiriam: "{n, plural, one {Uma resposta decidiria.} other {# respostas decidiriam.}}"

plano.aderencia.85: O plano atende à necessidade real.
plano.aderencia.70: O plano atende à necessidade na maior parte; alguns pontos pedem ajuste.
plano.aderencia.50: O plano resolve parte do problema.
plano.aderencia.30: O plano se afasta da necessidade em pontos centrais.
plano.aderencia.0: O plano não corresponde à necessidade descrita.

