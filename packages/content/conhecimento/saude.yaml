  - id: H3
    nome: Dependências e cadeia de suprimentos
    pergunta: F-11
    criterio: { menos_6m: Atualizadas nos últimos 6 meses, 6_12m: Atualizadas há 6 a 12 meses, mais_1a: Desatualizadas há mais de 1 ano, vulneravel: Vulnerabilidade conhecida sem correção }
