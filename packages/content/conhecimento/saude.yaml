    nome: Juros da dívida
    pergunta: F-06
    criterio: { menos_10: "Perda abaixo de 10% do tempo (autorrelato)", 10_25: "Perda entre 10% e 25% do tempo (autorrelato)", mais_25: "Perda acima de 25% do tempo (autorrelato)" }
