    evidencias: [eol-praticas]
  - id: H5
    nome: Conhecimento e propriedade
    pergunta: E-06
    criterio: { uma: Partes críticas conhecidas por uma pessoa ou ninguém, duas: Partes críticas conhecidas por duas pessoas, tres_mais: Partes críticas conhecidas por três ou mais pessoas }
    status: { uma: critico, duas: atencao, tres_mais: saudavel }
