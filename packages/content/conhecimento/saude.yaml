  - id: H2
    nome: Rede de segurança
    pergunta: F-08
    criterio: { nenhum: Nenhuma proteção nas áreas críticas, poucos: Cobertura parcial nas áreas críticas, criticas: Caracterização nas áreas críticas, contratos: Caracterização e contratos nas fronteiras }
    status: { nenhum: critico, poucos: atencao, criticas: saudavel, contratos: saudavel }
